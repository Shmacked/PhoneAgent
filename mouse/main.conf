# BlueZ settings used only by the phone mouse (bt_mouse.py starts bluetoothd with this file).
[General]
Name = Phone Mouse
# Major class "peripheral", minor "pointing device": the iPhone lists it as a mouse.
Class = 0x000580
DiscoverableTimeout = 0
PairableTimeout = 0
# Classic Bluetooth only (the mouse uses classic HID).
ControllerMode = bredr
JustWorksRepairing = always

[Policy]
AutoEnable = true
